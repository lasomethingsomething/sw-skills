name: Upgrade planner external links

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check curated guidance links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: --verbose --no-progress --exclude-mail 'shopware-upgrade-planner/SKILL.md' 'shopware-upgrade-planner/references/*.md' 'shopware-upgrade-planner/assets/*.md'
          fail: true
