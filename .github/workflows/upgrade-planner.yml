name: Upgrade planner checks

on:
  push:
    paths:
      - 'shopware-upgrade-planner/**'
      - '.github/workflows/upgrade-planner.yml'
  pull_request:
    paths:
      - 'shopware-upgrade-planner/**'
      - '.github/workflows/upgrade-planner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.2
      - name: Validate skill and evaluation suite
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python shopware-upgrade-planner/scripts/check_skill.py --base-ref "$BASE_SHA"
          else
            python shopware-upgrade-planner/scripts/check_skill.py
          fi
      - name: Run deterministic tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s shopware-upgrade-planner/scripts -p 'test_*.py' -v
